[package]
name = "ograf-core"
version = "0.3.0"
edition = "2021"
authors = ["Heine Froholdt <heine.froholdt@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Pure Rust implementation of the OGraf v1 graphics-control API (HTTP + WebSocket) - 100% spec-compliant library"
repository = "https://github.com/HeineFro/ograf-core"
homepage = "https://github.com/HeineFro/ograf-core"
documentation = "https://docs.rs/ograf-core"
readme = "README.md"
keywords = ["ograf", "graphics", "broadcast", "websocket", "axum"]
categories = ["web-programming", "api-bindings", "multimedia"]
rust-version = "1.75"

[lib]
name = "ograf_core"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
mime_guess = "2"
async-trait = "0.1"
dashmap = "6.1"
